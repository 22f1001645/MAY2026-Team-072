openapi: 3.0.3
info:
  title: Ekatva OS REST API Specification
  description: |
    # Ekatva OS — Unified REST API Specification
    The Community Operating System for the IIT Madras BS Degree Ecosystem.
    Built by Team-072 (BSCS3001 Software Engineering Project, May 2026 Term).

    ### Authentication
    The API uses Bearer JWT tokens passed via the `Authorization: Bearer <token>` header, with refresh tokens managed securely via HTTP-only cookies.
    
    ### Standard Response Formats
    - Success responses return JSON payloads (`application/json`).
    - Error responses follow a standard envelope: `{ "error": "Human readable message", "code": "error_code" }`.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
  - url: https://api.ekatva.os/api/v1
    description: Production Environment

tags:
  - name: Health & System
    description: Server health and status endpoints
  - name: Auth & Identity
    description: Authentication, session management, user profiles, and capabilities
  - name: Community & Organisations
    description: Forest houses, clubs, societies, regional chapters, and POR governance
  - name: Organisation Profiles
    description: Public profiles, brand kits, social links, logos, and city progression
  - name: Proposals & Approvals
    description: Proposal submissions, admin queues, approvals, audit logs, and collaborations
  - name: Events & Discovery
    description: Published event feeds, details, editing, and cancellations
  - name: Registrations & Attendance
    description: Event signups, QR attendance scanner, volunteer credits, and broadcasts
  - name: Campaigns & Forms
    description: Promotional packages, marketing emails, custom signup fields, and registration slugs
  - name: Event Schedules
    description: Agenda timelines, session items, presets, and progression unlock validation
  - name: Tasks & Operations
    description: Crew operational tasks and assignment checklists
  - name: Activity Timeline
    description: Chronological unified audit trails and event milestones
  - name: Expenses & Reimbursements
    description: Multi-stage expense approval pipeline, bill uploads, and bulk verifications
  - name: Reports & Feedback
    description: Post-event reflections, attendee reviews, ratings, and feedback summaries
  - name: Gamification & Recognition
    description: Student point ledgers, activity tier bonuses, and city leaderboards
  - name: Notifications & Dashboard
    description: In-app notifications and role-tailored dashboard telemetry
  - name: Admin & Analytics
    description: Ecosystem analytics, student activity fee utilisation, and point rules
  - name: Media & Static Uploads
    description: Logos, campaign posters, and bill receipts

paths:
  # ---------------------------------------------------------------------------
  # Health & System
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags: [Health & System]
      summary: API Health Check
      description: Returns health status, service identifier, and API version.
      responses:
        '200':
          description: Service is operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: "ok" }
                  service: { type: string, example: "ekatva-os-api" }
                  version: { type: string, example: "v1" }

  # ---------------------------------------------------------------------------
  # Auth & Identity
  # ---------------------------------------------------------------------------
  /auth/register:
    post:
      tags: [Auth & Identity]
      summary: Register Student Account (FR-A1)
      description: Self-service registration for new students in the IIT Madras BS ecosystem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, city]
              properties:
                name: { type: string, example: "Aarav Mehta" }
                email: { type: string, format: email, example: "aarav@ekatva.os" }
                password: { type: string, format: password, example: "student123" }
                city: { type: string, example: "Hyderabad" }
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered

  /auth/login:
    post:
      tags: [Auth & Identity]
      summary: User Login (FR-A1)
      description: Authenticates user credentials and returns JWT tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: "admin@ekatva.os" }
                password: { type: string, format: password, example: "admin123" }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Auth & Identity]
      summary: Refresh Access Token
      description: Exchanges a valid HTTP-only refresh cookie for a fresh access token.
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth & Identity]
      summary: User Logout
      description: Revokes the current session and clears authentication cookies.
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Successfully logged out" }

  /auth/me:
    get:
      tags: [Auth & Identity]
      summary: Get Current User Identity & Capabilities (FR-A3)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile and computed capability permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me/profile:
    patch:
      tags: [Auth & Identity]
      summary: Update Personal Profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                city: { type: string, example: "Bengaluru" }
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/academic-status:
    patch:
      tags: [Auth & Identity]
      summary: Update Academic Status (Student Self-Declaration)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academic_level, academic_status]
              properties:
                academic_level: { type: string, enum: [foundation, diploma, degree] }
                academic_status: { type: string, enum: [active, drop, suspended, graduated] }
      responses:
        '200':
          description: Academic status recorded

  /admin/users/{user_id}/academic-status:
    patch:
      tags: [Auth & Identity]
      summary: Admin Academic Status Override
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [academic_level, academic_status]
              properties:
                academic_level: { type: string, enum: [foundation, diploma, degree] }
                academic_status: { type: string, enum: [active, drop, suspended, graduated] }
      responses:
        '200':
          description: Status overridden by admin
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{user_id}/impersonate:
    post:
      tags: [Auth & Identity]
      summary: Impersonate User (Admin Dev Tool)
      security:
        - BearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Switched user session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  # ---------------------------------------------------------------------------
  # Community & Organisations
  # ---------------------------------------------------------------------------
  /cities:
    get:
      tags: [Community & Organisations]
      summary: List Supported Cities (FR-A1)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of registered cities with regional affiliations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'

  /orgs:
    get:
      tags: [Community & Organisations]
      summary: List All Organisations (FR-A1)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of houses, societies, clubs, and regions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organisation'
    post:
      tags: [Community & Organisations]
      summary: Create Organisation (Admin) (FR-A1)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string, example: "Quantum Computing Society" }
                type: { type: string, enum: [house, society, region, council] }
                city: { type: string, example: "Chennai" }
                category: { type: string, example: "Technical" }
                description: { type: string }
                logo: { type: string, format: binary }
                banner: { type: string, format: binary }
      responses:
        '201':
          description: Organisation created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'

  /houses:
    get:
      tags: [Community & Organisations]
      summary: List Forest Houses (FR-A1)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All 12 Forest Houses

  /regions:
    get:
      tags: [Community & Organisations]
      summary: List Geographic Regions
      description: Public endpoint used by student registration forms.
      responses:
        '200':
          description: List of regions

  /regions/{region_id}/cities:
    get:
      tags: [Community & Organisations]
      summary: List Cities in Region
      parameters:
        - name: region_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Cities belonging to the given region
    post:
      tags: [Community & Organisations]
      summary: Add City to Region (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: region_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: "Pune" }
      responses:
        '201':
          description: City created

  /councils/upper-house:
    get:
      tags: [Community & Organisations]
      summary: List Upper House Council Members
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active Secretaries and Deputy Secretaries

  /councils/lower-house:
    get:
      tags: [Community & Organisations]
      summary: List Lower House Council Members
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active Regional Coordinators

  /pors:
    get:
      tags: [Community & Organisations]
      summary: List All Active PORs (FR-A2)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of positions of responsibility assignments

  /orgs/{id}/pors:
    post:
      tags: [Community & Organisations]
      summary: Assign Position of Responsibility (Admin) (FR-A2)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, por_type]
              properties:
                user_id: { type: string }
                por_type: { type: string, example: "Regional Coordinator" }
                term: { type: string, example: "May 2026" }
      responses:
        '201':
          description: POR assigned

  /pors/{id}/deactivate:
    patch:
      tags: [Community & Organisations]
      summary: Deactivate POR Assignment (Admin) (FR-A5)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: POR marked inactive

  /users:
    get:
      tags: [Community & Organisations]
      summary: Search Users / Student Roster (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of matching users

  # ---------------------------------------------------------------------------
  # Organisation Profiles & Progression (Phase 4)
  # ---------------------------------------------------------------------------
  /orgs/{org_id}/profile:
    get:
      tags: [Organisation Profiles]
      summary: Get Organisation Public Profile (ORG-01)
      security:
        - BearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Org profile with brand kit, social links, and bio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgProfile'
    patch:
      tags: [Organisation Profiles]
      summary: Update Organisation Profile (ORG-01)
      security:
        - BearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tagline: { type: string }
                bio: { type: string }
                brand_color: { type: string, example: "#6366f1" }
                accent_color: { type: string, example: "#ec4899" }
                instagram_url: { type: string }
                linkedin_url: { type: string }
                discord_url: { type: string }
                github_url: { type: string }
                website_url: { type: string }
      responses:
        '200':
          description: Profile updated

  /orgs/{org_id}/logo:
    post:
      tags: [Organisation Profiles]
      summary: Upload Organisation Logo (ORG-01)
      security:
        - BearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Logo saved and profile returned

  /orgs/{org_id}/social-links:
    put:
      tags: [Organisation Profiles]
      summary: Replace Social Links (ORG-02)
      security:
        - BearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instagram_url: { type: string, nullable: true }
                linkedin_url: { type: string, nullable: true }
                discord_url: { type: string, nullable: true }
                github_url: { type: string, nullable: true }
                website_url: { type: string, nullable: true }
      responses:
        '200':
          description: Social links updated

  /orgs/{org_id}/progression:
    get:
      tags: [Organisation Profiles]
      summary: Get Organisation City Progression (PROG-01, PROG-03)
      security:
        - BearerAuth: []
      parameters:
        - name: org_id
          in: path
          required: true
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Fest-tier unlock qualifications and past event track record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgProgression'

  # ---------------------------------------------------------------------------
  # Proposals & Approvals
  # ---------------------------------------------------------------------------
  /activities:
    post:
      tags: [Proposals & Approvals]
      summary: Submit Meetup/Fest Proposal (Organiser) (FR-B1, FR-B2)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalSubmit'
      responses:
        '201':
          description: Proposal submitted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Quota guardrail violated

  /proposals:
    get:
      tags: [Proposals & Approvals]
      summary: Proposal Queue (Admin) (FR-B3)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string, default: "pending", enum: [pending, approved, changes_requested, rejected] }
      responses:
        '200':
          description: Proposals filtered by status

  /proposals/{activity_id}:
    get:
      tags: [Proposals & Approvals]
      summary: Proposal Details (Admin)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Full proposal details

  /proposals/{activity_id}/decision:
    post:
      tags: [Proposals & Approvals]
      summary: Record Proposal Decision (Admin) (FR-B3, FR-B4, FR-C1)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, changes, reject] }
                note: { type: string }
      responses:
        '200':
          description: Decision applied; event published if approved

  /activities/{activity_id}/audit:
    get:
      tags: [Proposals & Approvals]
      summary: Event Audit Trail
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Historical decisions and edits on this activity

  /audit-log:
    get:
      tags: [Proposals & Approvals]
      summary: Global Audit Log (Admin) (FR-B4)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: System-wide admin and governance audit entries

  /activities/{activity_id}/collaborators/{collab_id}/respond:
    post:
      tags: [Proposals & Approvals]
      summary: Respond to Collaboration Invite (PROPOSAL-06)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
        - name: collab_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, declined] }
      responses:
        '200':
          description: Collaboration status updated

  /activities/{activity_id}/reassign-meetup-head:
    post:
      tags: [Proposals & Approvals]
      summary: Reassign Meetup Head (PROPOSAL-05)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_meetup_head_user_id]
              properties:
                new_meetup_head_user_id: { type: string }
      responses:
        '200':
          description: Meetup Head reassigned

  # ---------------------------------------------------------------------------
  # Events & Discovery
  # ---------------------------------------------------------------------------
  /events:
    get:
      tags: [Events & Discovery]
      summary: City Event Discovery Feed (FR-C2, FR-C4)
      security:
        - BearerAuth: []
      parameters:
        - name: city
          in: query
          schema: { type: string }
        - name: scale
          in: query
          schema: { type: string, enum: [local_meetup, regional_meetup, regional_fest] }
        - name: dateRange
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Published events list

  /events/{activity_id}:
    get:
      tags: [Events & Discovery]
      summary: Event Details & Public Preview (FR-C3)
      description: Supports both UUID and URL slug resolution. Public preview available for anonymous callers.
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Event detail object
    put:
      tags: [Events & Discovery]
      summary: Edit Event Details (Organiser)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                starts_at: { type: string, format: date-time }
                venue: { type: string }
      responses:
        '200':
          description: Event updated
    delete:
      tags: [Events & Discovery]
      summary: Cancel Event (Organiser)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Event marked cancelled

  # ---------------------------------------------------------------------------
  # Registrations & Attendance
  # ---------------------------------------------------------------------------
  /events/{activity_id}/register:
    post:
      tags: [Registrations & Attendance]
      summary: Register for Event (Student) (FR-D1, FR-D2)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                custom_answers:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Registered (confirmed or waitlisted)
        '409':
          description: Already registered
    delete:
      tags: [Registrations & Attendance]
      summary: Unregister from Event
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Unregistered and waitlist advanced

  /events/{activity_id}/registrations:
    get:
      tags: [Registrations & Attendance]
      summary: Event Attendee Roster (Organiser)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: List of registered attendees

  /events/{activity_id}/attendance:
    post:
      tags: [Registrations & Attendance]
      summary: Batch Check-In Attendees (FR-D6, FR-G1)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registration_ids]
              properties:
                registration_ids:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Attendance checked in and points awarded

  /events/{activity_id}/scan:
    post:
      tags: [Registrations & Attendance]
      summary: QR Code Camera Check-In Scanner (CAMPAIGN-06)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: "Signed QR token payload" }
      responses:
        '200':
          description: Scan verified and check-in logged

  /events/{activity_id}/broadcast:
    post:
      tags: [Registrations & Attendance]
      summary: Broadcast Push Alert to Registrants (FR-D3)
      security:
        - BearerAuth: []
      parameters:
        - name: activity_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        '200':
          description: Broadcast delivered to all attendee notifications

  /me/registrations:
    get:
      tags: [Registrations & Attendance]
      summary: Current User Event Registrations (FR-D5)
      security:
        - BearerAuth: []
      responses:
        '200':
