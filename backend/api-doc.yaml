# =============================================================================
# Components & Schemas
# =============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing, invalid, or expired authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Insufficient role permissions or missing POR authority
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadRequest:
      description: Malformed payload or validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    ErrorEnvelope:
      type: object
      required: [error, code]
      properties:
        error: { type: string, example: "Invalid credentials" }
        code: { type: string, example: "unauthorized" }

    AuthResponse:
      type: object
      properties:
        access_token: { type: string }
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: "Aarav Mehta" }
        email: { type: string, format: email, example: "aarav@ekatva.os" }
        role: { type: string, enum: [student, admin] }
        city: { type: string, example: "Hyderabad" }
        academic_level: { type: string, example: "diploma" }
        academic_status: { type: string, example: "active" }

    UserWithCapabilities:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            capabilities:
              type: object
              properties:
                can_propose: { type: boolean }
                can_review_proposals: { type: boolean }
                can_verify_expenses: { type: boolean }
                pors:
                  type: array
                  items:
                    $ref: '#/components/schemas/PORAssignment'

    City:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: "Hyderabad" }
        region_id: { type: string }
        region_name: { type: string, example: "South Region" }

    Organisation:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: "Coding Club" }
        type: { type: string, enum: [house, society, region, council] }
        city: { type: string, example: "Chennai" }
        logo_url: { type: string, nullable: true }
        banner_url: { type: string, nullable: true }
        tagline: { type: string, nullable: true }
        bio: { type: string, nullable: true }

    OrgProfile:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        city: { type: string }
        logo_url: { type: string, nullable: true }
        tagline: { type: string, nullable: true }
        bio: { type: string, nullable: true }
        brand_kit:
          type: object
          properties:
            brand_color: { type: string }
            accent_color: { type: string }
        social_links:
          type: object
          properties:
            instagram_url: { type: string, nullable: true }
            linkedin_url: { type: string, nullable: true }
            discord_url: { type: string, nullable: true }
            github_url: { type: string, nullable: true }
            website_url: { type: string, nullable: true }

    OrgProgression:
      type: object
      properties:
        org_id: { type: string }
        city: { type: string }
        qualifies_for_fest: { type: boolean }
        completed_meetups_in_city: { type: integer }
        min_required_meetups: { type: integer, example: 3 }
        reasons:
          type: array
          items: { type: string }

    PORAssignment:
      type: object
      properties:
        id: { type: string }
        user_id: { type: string }
        org_id: { type: string }
        por_type: { type: string, example: "Secretary" }
        term: { type: string, example: "May 2026" }
        active: { type: boolean }
        council_tier: { type: string, nullable: true }

    ProposalSubmit:
      type: object
      required: [title, org_id, city, scale, venue, starts_at, capacity]
      properties:
        title: { type: string, example: "Hyderabad Hackathon 2026" }
        org_id: { type: string }
        city: { type: string, example: "Hyderabad" }
        scale: { type: string, enum: [local_meetup, regional_meetup, regional_fest] }
        venue: { type: string, example: "T-Hub, Gachibowli" }
        starts_at: { type: string, format: date-time }
        capacity: { type: integer, example: 100 }
        description: { type: string }
        budget:
          type: array
          items:
            type: object
            required: [label, planned]
            properties:
              label: { type: string, example: "Refreshments" }
              planned: { type: integer, example: 5000 }
        collaborator_org_ids:
          type: array
          items: { type: string }
        team_members:
          type: array
          items:
            type: object
            required: [user_id, role]
            properties:
              user_id: { type: string }
              role: { type: string, example: "Logistics Lead" }

    Activity:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        org: { type: string }
        city: { type: string }
        scale: { type: string }
        status: { type: string, enum: [published, completed, cancelled] }
        proposal_status: { type: string, enum: [pending, approved, changes_requested, rejected] }
        starts_at: { type: string, format: date-time }
        venue: { type: string }
        description: { type: string }
        capacity: { type: integer }
        registered: { type: integer }
        attended: { type: integer }
        budget: { type: array, items: { type: object } }
        collaborators: { type: array, items: { type: object } }
        team_members: { type: array, items: { type: object } }

    FormFieldCreate:
      type: object
      required: [field_type, label]
      properties:
        field_type: { type: string, enum: [text, number, select, checkbox, textarea] }
        label: { type: string, example: "Dietary Preference" }
        required: { type: boolean, default: false }
        options:
          type: array
          items: { type: string }
          example: ["Vegetarian", "Non-Vegetarian", "Vegan"]

    ScheduleItemInput:
      type: object
      required: [title, start_time, end_time]
      properties:
        title: { type: string, example: "Keynote: Building Scalable Systems" }
        speaker: { type: string, example: "Prof. Andrew Ng" }
        start_time: { type: string, example: "10:00 AM" }
        end_time: { type: string, example: "11:00 AM" }
        description: { type: string }
        order: { type: integer, default: 0 }

    ExpenseInput:
      type: object
      required: [activity_id, label, amount]
      properties:
        activity_id: { type: string }
        budget_line_id: { type: string, nullable: true }
        label: { type: string, example: "Venue Sound System Rental" }
        amount: { type: integer, example: 4500 }
        bill_name: { type: string, default: "receipt.pdf" }

    ExpenseDraftItem:
      type: object
      properties:
        id: { type: string }
        budget_line_id: { type: string, nullable: true }
        label: { type: string }
        amount: { type: integer }
        bill_name: { type: string, nullable: true }
        status: { type: string, enum: [draft, submitted, verified, approved, paid] }

    ReportReflectionInput:
      type: object
      properties:
        summary: { type: string }
        challenges: { type: string }
        learnings: { type: string }
        status: { type: string, enum: [draft, submitted] }
